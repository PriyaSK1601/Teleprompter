<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="editor-app">
      <aside class="scripts-sidebar">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">Teleprompter</p>
            <h1>Scripts</h1>
          </div>
          <button id="newScriptButton" class="icon-button" type="button" aria-label="Create new script">+</button>
        </div>
        <input id="scriptSearch" class="search-input" type="search" placeholder="Search scripts" />
        <ul id="scriptList" class="script-list"></ul>
      </aside>

      <section class="editor-workspace">
        <header class="editor-topbar">
          <div>
            <p class="eyebrow">Editor Mode</p>
            <h2>Prepare your script</h2>
          </div>
          <button id="settingsButton" class="icon-button" type="button" aria-label="Open settings">⚙</button>
        </header>

        <section class="script-card">
          <input id="scriptTitle" class="title-input" type="text" placeholder="Untitled script" />
          <textarea id="scriptBody" class="script-body" placeholder="Paste your script here..."></textarea>
        </section>

        <footer class="editor-actions">
          <p id="status" class="status-text" aria-live="polite">Ready</p>
          <div class="primary-actions">
            <button id="clearScriptButton" class="secondary-button" type="button">Clear</button>
            <button id="saveScriptButton" class="secondary-button" type="button">Save Script</button>
            <button id="startTeleprompterButton" class="primary-button" type="button">Start Teleprompter</button>
          </div>
        </footer>
      </section>
    </main>

    <section id="settingsModal" class="settings-modal" hidden>
      <div id="settingsBackdrop" class="settings-backdrop"></div>
      <aside class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <div>
            <p class="eyebrow">Settings</p>
            <h2 id="settingsTitle">Teleprompter preferences</h2>
          </div>
          <button id="closeSettingsButton" class="icon-button" type="button" aria-label="Close settings">×</button>
        </header>

        <section class="settings-section">
          <h3>Appearance</h3>
          <div class="settings-grid">
            <label class="field-label" for="fontSizeInput">
              Font size
              <input id="fontSizeInput" class="range-input" type="range" min="18" max="72" step="1" />
              <span id="fontSizeValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="lineHeightInput">
              Line spacing
              <input id="lineHeightInput" class="range-input" type="range" min="1.1" max="2.2" step="0.05" />
              <span id="lineHeightValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="textColorInput">
              Text colour
              <input id="textColorInput" class="color-input" type="color" />
            </label>
            <label class="field-label" for="backgroundColorInput">
              Background colour
              <input id="backgroundColorInput" class="color-input" type="color" />
            </label>
            <label class="field-label" for="opacityInput">
              Overlay opacity
              <input id="opacityInput" class="range-input" type="range" min="0.25" max="1" step="0.01" />
              <span id="opacityValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="alignmentSelect">
              Alignment
              <select id="alignmentSelect" class="text-input">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </label>
          </div>
          <div class="settings-preview-card">
            <p class="eyebrow">Live Preview</p>
            <div id="settingsPreview" class="settings-preview-text">
              Your words appear here, styled exactly like the teleprompter overlay.
            </div>
          </div>
        </section>

        <section class="settings-section">
          <h3>Teleprompter</h3>
          <div class="settings-grid">
            <label class="field-label" for="scrollModeSelect">
              Scroll mode
              <select id="scrollModeSelect" class="text-input">
                <option value="manual">Manual</option>
                <option value="voice">Voice Tracking</option>
              </select>
            </label>
            <label class="field-label" for="scrollSpeedInput">
              Manual scroll speed
              <input id="scrollSpeedInput" class="range-input" type="range" min="8" max="160" step="1" />
              <span id="scrollSpeedValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="highlightModeSelect">
              Highlight mode
              <select id="highlightModeSelect" class="text-input">
                <option value="none">Off</option>
                <option value="sentence">Current line</option>
                <option value="word">Word focus</option>
              </select>
            </label>
            <label class="switch-row">
              <input id="countdownEnabledInput" type="checkbox" />
              <span>Enable countdown</span>
            </label>
            <label class="field-label" for="countdownSecondsInput">
              Countdown duration
              <input id="countdownSecondsInput" class="number-input" type="number" min="0" max="10" step="1" />
            </label>
          </div>
        </section>

        <section class="settings-section">
          <h3>Actions</h3>
          <div class="settings-actions">
            <button id="resetSettingsButton" class="secondary-button" type="button">Reset defaults</button>
          </div>
        </section>
      </aside>
    </section>

    <script src="../../../dist/renderer/editor/index.js"></script>
  </body>
</html>
