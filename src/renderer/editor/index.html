<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="eyebrow">Stage 4 customisation and settings</p>
        <h1>Teleprompter Editor</h1>
        <p class="muted">
          Paste or edit a plain-text script, save it locally, and send the active script to the overlay.
        </p>
        <section class="editor-grid">
          <aside class="script-list-panel">
            <div class="section-header">
              <h2>Saved scripts</h2>
              <button id="newScriptButton" type="button">New</button>
            </div>
            <ul id="scriptList" class="script-list"></ul>
          </aside>
          <section class="script-editor-panel">
            <label class="field-label" for="scriptTitle">Title</label>
            <input id="scriptTitle" class="text-input" type="text" placeholder="Untitled script" />
            <label class="field-label" for="scriptBody">Script</label>
            <textarea id="scriptBody" class="script-body" placeholder="Paste your script here..."></textarea>
            <div class="actions">
              <button id="saveScriptButton" type="button">Save script</button>
              <button id="renameScriptButton" type="button">Rename</button>
              <button id="deleteScriptButton" type="button">Delete</button>
              <button id="clearScriptButton" type="button">Clear editor</button>
            </div>
          </section>
        </section>
        <section class="settings-panel">
          <div class="section-header">
            <h2>Overlay settings</h2>
            <div class="section-actions">
              <button id="resetSettingsButton" type="button">Reset defaults</button>
              <button id="recoveryResetButton" type="button">Recover overlay</button>
            </div>
          </div>
          <div class="settings-grid">
            <label class="field-label" for="fontSizeInput">
              Font size
              <input id="fontSizeInput" class="range-input" type="range" min="18" max="72" step="1" />
              <span id="fontSizeValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="lineHeightInput">
              Line spacing
              <input id="lineHeightInput" class="range-input" type="range" min="1.1" max="2.2" step="0.05" />
              <span id="lineHeightValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="textColorInput">
              Text colour
              <input id="textColorInput" class="color-input" type="color" />
            </label>
            <label class="field-label" for="alignmentSelect">
              Alignment
              <select id="alignmentSelect" class="text-input">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </label>
            <label class="field-label" for="opacityInput">
              Overlay opacity
              <input id="opacityInput" class="range-input" type="range" min="0.25" max="1" step="0.01" />
              <span id="opacityValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="backgroundColorInput">
              Background colour
              <input id="backgroundColorInput" class="color-input" type="color" />
            </label>
            <label class="check-row settings-check">
              <input id="countdownEnabledInput" type="checkbox" />
              <span>Enable countdown</span>
            </label>
            <label class="field-label" for="countdownSecondsInput">
              Countdown seconds
              <input id="countdownSecondsInput" class="number-input" type="number" min="0" max="10" step="1" />
            </label>
            <label class="field-label" for="scrollSpeedInput">
              Scroll speed
              <input id="scrollSpeedInput" class="range-input" type="range" min="8" max="160" step="1" />
              <span id="scrollSpeedValue" class="setting-value"></span>
            </label>
            <label class="field-label" for="highlightModeSelect">
              Highlight mode
              <select id="highlightModeSelect" class="text-input">
                <option value="none">None</option>
                <option value="sentence">Sentence experiment</option>
                <option value="word">Word experiment</option>
              </select>
            </label>
          </div>
        </section>
        <div class="actions">
          <button id="pingButton" type="button">Ping main process</button>
          <button id="openOverlayButton" type="button">Open overlay</button>
          <button id="hideOverlayButton" type="button">Hide overlay</button>
          <button id="resetOverlayButton" type="button">Reset position</button>
          <button id="closeOverlayButton" type="button">Close overlay</button>
        </div>
        <div class="actions">
          <button id="startPauseButton" type="button">Start / pause</button>
          <button id="restartButton" type="button">Restart</button>
          <button id="speedUpButton" type="button">Speed up</button>
          <button id="slowDownButton" type="button">Slow down</button>
        </div>
        <label class="check-row">
          <input id="clickThroughCheckbox" type="checkbox" />
          <span>Enable click-through experiment</span>
        </label>
        <section class="shortcut-panel">
          <div class="section-header">
            <h2>Global shortcuts</h2>
            <div class="section-actions">
              <button id="saveShortcutsButton" type="button">Save shortcuts</button>
              <button id="resetShortcutsButton" type="button">Reset shortcuts</button>
            </div>
          </div>
          <ul id="shortcutList"></ul>
        </section>
        <pre id="status" class="status">Ready.</pre>
      </section>
    </main>
    <script src="../../../dist/renderer/editor/index.js"></script>
  </body>
</html>
