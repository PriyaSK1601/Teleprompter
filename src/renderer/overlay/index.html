<!doctype html>
<html class="overlay-document" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teleprompter Overlay</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body class="overlay-body">
    <main class="overlay-shell">
      <header class="overlay-topbar">
        <div class="overlay-drag-handle">
          <span>Teleprompter</span>
          <span id="modeLabel" class="overlay-mode-pill">Manual</span>
        </div>
        <nav class="overlay-control-bar" aria-label="Teleprompter controls">
          <button id="slowDownButton" class="overlay-control" type="button" aria-label="Slower (Left Arrow)" data-tooltip="Slower (&larr;)">&minus;</button>
          <button id="playPauseButton" class="overlay-control primary" type="button" data-tooltip="Play/Pause (Space)">Play</button>
          <button id="restartButton" class="overlay-control" type="button" data-tooltip="Restart (R)">Restart</button>
          <button id="speedUpButton" class="overlay-control" type="button" aria-label="Faster (Right Arrow)" data-tooltip="Faster (&rarr;)">+</button>
          <button id="closeOverlayButton" class="overlay-control" type="button" data-tooltip="Exit overlay (Esc)">Close</button>
        </nav>
      </header>

      <section class="countdown" id="countdown" hidden></section>

      <section class="prompt-viewport" id="promptViewport">
        <article class="prompt-text" id="promptText">
          <p>No active script loaded yet.</p>
        </article>
      </section>

      <footer class="overlay-progress-wrap">
        <div class="overlay-progress-main">
          <div class="overlay-progress-track" aria-hidden="true">
            <div id="progressBar" class="overlay-progress-bar"></div>
          </div>
          <div class="overlay-status-row">
            <span id="elapsedLabel">00:00</span>
            <span id="remainingLabel">Remaining --:--</span>
            <span id="speedLabel">21 px/s</span>
            <span id="feedbackLabel"></span>
          </div>
        </div>
        <span id="progressLabel" class="overlay-progress-label">0%</span>
      </footer>
    </main>
    <script src="../../../dist/renderer/overlay/index.js"></script>
  </body>
</html>
